[workspace]
members = [
    "crates/dek-cli",
    "crates/dek-core",
    "crates/dek-controller",
    "crates/dek-target",
    "crates/dek-linux",
]
default-members = ["crates/dek-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dek-core = { path = "crates/dek-core" }
dek-controller = { path = "crates/dek-controller" }
dek-target = { path = "crates/dek-target" }
dek-linux = { path = "crates/dek-linux" }
