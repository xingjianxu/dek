[package]
name = "dek-controller"
version.workspace = true
edition.workspace = true

[features]
benchmark-cache = []

[dependencies]
dek-core.workspace = true
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[[bin]]
name = "dek-cache-benchmark"
path = "src/bin/cache_benchmark.rs"
required-features = ["benchmark-cache"]
