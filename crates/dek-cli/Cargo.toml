[package]
name = "dek-cli"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
dek-core.workspace = true
dek-controller.workspace = true
dek-target.workspace = true
hostname = "0.4"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rmp-serde = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
age = { version = "0.12.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
dek-linux.workspace = true

[[bin]]
name = "dek"
path = "src/main.rs"
